workflows:
  krkr-ipa:
    name: KrkrUnpack IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        SCHEME: KrkrUnpack
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
          xcodegen --version
      - name: Generate project
        script: |
          cd KrkrUnpack
          xcodegen generate
          ls -d *.xcodeproj
      - name: Resolve packages
        script: |
          cd KrkrUnpack
          xcodebuild -resolvePackageDependencies -project KrkrUnpack.xcodeproj -scheme "$SCHEME"
      - name: Build (unsigned)
        script: |
          set -o pipefail
          cd KrkrUnpack
          xcodebuild -project KrkrUnpack.xcodeproj -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$CM_BUILD_DIR/xcodebuild.log" | tail -40
      - name: Package IPA
        script: |
          set -e
          APP=$(find KrkrUnpack/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"; test -d "$APP"
          rm -rf "$CM_BUILD_DIR/out" && mkdir -p "$CM_BUILD_DIR/out/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/out/Payload/"
          cd "$CM_BUILD_DIR/out" && zip -qry "$CM_BUILD_DIR/KrkrUnpack-unsigned.ipa" Payload
          ls -lh "$CM_BUILD_DIR/KrkrUnpack-unsigned.ipa"
    artifacts:
      - KrkrUnpack-unsigned.ipa
      - xcodebuild.log
